  <rect x="370" y="250" width="14" height="14" rx="3" fill="#3b5bdb"/><text x="390" y="262" font-size="13" fill="#495057">Chef planning + checking</text>
  <text x="200" y="288" font-size="13" fill="#868e96">Units are made up to show the idea, not real prices.</text>
